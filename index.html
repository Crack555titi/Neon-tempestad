<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neón Tempestad</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>

  <div id="menu" class="ov">
    <h1>NEÓN <span>TEMPESTAD</span></h1>
    <div class="row" id="chars"></div>
    <div class="row" id="diffs"></div>
    <div id="dd"></div>
    <button id="go">▶ JUGAR</button>
    <p class="help">A/D mover · W/Espacio saltar (doble salto) · S bajar de plataforma · Ratón apuntar · Clic izq. disparo primario · Clic der. secundaria · Shift movimiento · Q definitiva · B invoca al jefe ya</p>
  </div>

  <div id="mastery" class="ov" style="display:none">
    <h2>NODO DE MAESTRÍA <small id="mq"></small></h2>
    <div class="row" id="nodes"></div>
  </div>

  <div id="end" class="ov" style="display:none">
    <h2 id="endT"></h2>
    <p id="endS"></p>
    <button id="again">VOLVER AL MENÚ</button>
  </div>
</div>
<!-- Scripts clásicos (no módulos) para que funcione abriendo index.html con doble clic. El orden importa. -->
<script src="engine.js"></script>
<script src="fx.js"></script>
<script src="data_characters.js"></script>
<script src="data_enemies.js"></script>
<script src="bosses.js"></script>
<script src="abilities.js"></script>
<script src="ui.js"></script>
</body>
</html>
